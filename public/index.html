<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>米家与小爱 · Web</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M4 11l8-7 8 7' fill='none' stroke='%233d6de0' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M6 10v10h12V10' fill='none' stroke='%233d6de0' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <!-- 标题栏 -->
    <header class="titlebar">
      <div class="brand">
        <span class="brand-logo" id="brandLogo"></span>
        <span class="brand-name" data-zh="米家与小爱">米家与小爱</span>
        <span class="brand-mode" id="brandMode">演示模式</span>
      </div>
      <div class="titlebar-right">
        <button class="icon-btn lang-btn" id="btnLang" title="切换语言 / Language">中</button>
        <button class="icon-btn" id="btnTheme" title="切换深浅色"></button>
        <button class="icon-btn win-btn" id="btnMin" title="最小化（网页版由浏览器窗口管理）"></button>
        <button class="icon-btn win-btn" id="btnMax" title="最大化（网页版由浏览器窗口管理）"></button>
        <button class="icon-btn win-btn close" id="btnClose" title="关闭（网页版由浏览器窗口管理）"></button>
      </div>
    </header>

    <!-- 家庭标签行 -->
    <div class="tabsbar">
      <div class="family-tabs" id="familyTabs"></div>
      <div class="tabsbar-actions">
        <button class="ghost-btn" id="btnRoomManage" data-action="room-manage" data-zh="房间管理">房间管理</button>
        <button class="ghost-btn" id="btnRefresh" data-action="refresh" data-zh="刷新设备">刷新设备</button>
      </div>
    </div>

    <!-- 主体 -->
    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content" id="content"></main>
    </div>

    <!-- 播放条 -->
    <footer class="playerbar" id="playerbar">
      <div class="player-progress" id="playerProgress"></div>
      <div class="player-inner" id="playerInner"></div>
    </footer>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
